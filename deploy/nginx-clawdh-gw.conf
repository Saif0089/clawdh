# clawdh gateway — reverse proxy with TLS (certbot manages the 443 block).
# Streaming (SSE) must not be buffered, and Claude responses can be long-lived.
server {
    listen 80;
    server_name clawdh-gw.207.180.203.98.sslip.io;

    # A Claude Code request carries the whole conversation, so a session with a
    # few screenshots in it is many megabytes — Anthropic's own limit is 32MB.
    # nginx defaults to 1m, which silently 413s those requests with an HTML
    # error page; Claude Code renders any 413 as "Request too large (max 32MB),
    # run /compact", so the member is told to compact a conversation that was
    # never actually too large for Anthropic. Sit above the gateway's own
    # maxRequestBody (64MiB) so the gateway's JSON error is what a member sees
    # when a request really is too big, never nginx's HTML.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
