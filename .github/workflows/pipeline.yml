name: Pipeline

# One pipeline, two ways to trigger a release:
#   - push to main:  test -> e2e -> build -> publish updates the rolling
#     "latest" GitHub Release. This is the "just push to main" path —
#     no version bump needed for day-to-day changes.
#   - push a `vX.Y.Z` tag: same test -> e2e -> build, but publish
#     creates a proper pinned, versioned release instead.
# A pull_request only runs test + e2e (no build/publish), as a
# pre-merge regression gate.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -v

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GitHub-hosted runners execute as an ordinary, non-elevated
    # per-user account with no way to answer a sudo/UAC prompt — a
    # timeout here (rather than a clean failure) is exactly what
    # "silently required admin" looks like.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Best-effort CI-only accommodation, not a product requirement:
      # Windows Defender's on-access scan of a freshly built/executed
      # exe can hold a brief lock right after it exits, which the
      # self-delete-on-uninstall test has to wait out. Excluding the Go
      # build/temp dirs removes that variance; if this can't (no rights
      # in this runner config), it just no-ops.
      - name: Exclude temp/work dirs from Defender scanning (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath $env:TEMP
            Write-Host "Added Defender exclusions."
          } catch {
            Write-Host "Could not add Defender exclusions (continuing anyway): $_"
          }

      - name: Run end-to-end lifecycle test
        run: go test ./test/e2e/... -v -timeout 8m

  # The Go tests drive the HTTP API directly and never load the page, so
  # a UI that was completely broken in a real browser once passed CI
  # while failing on every real machine. This job loads it for real, in
  # Chromium and in WebKit (Safari's engine).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: test/browser
        run: |
          npm install
          npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        working-directory: test/browser
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/browser/test-results/
          retention-days: 7

  # A real Linux user's install, in a container: an ordinary non-root
  # user, no systemd user bus (so the XDG autostart fallback is what
  # gets written), and the service then started from that entry's own
  # command line with the bare PATH a login-started process actually
  # gets. The hosted runner exercises none of that — it has the full
  # runner PATH and starts clawdh directly.
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install, log in and uninstall as a plain Linux user
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.26-bookworm bash -c '
            useradd -m -u 1000 tester
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl python3 >/dev/null 2>&1
            mkdir -p /home/tester/.config/fish
            chown -R tester /home/tester
            chmod 777 /tmp
            su tester -c "GOCACHE=/tmp/gocache GOPATH=/tmp/gopath GOFLAGS=-mod=mod bash /src/test/linux/run.sh"
          '

  # The real published install.sh, against the real published release,
  # in a clean container: architecture detection, the download, the
  # checksums CI publishes beside it, and a per-user install with no
  # root. Nothing else covers the first thing a Linux user does.
  #
  # Skipped on pull requests, where there is no published build for the
  # branch to install.
  linux-installer:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install from the published release
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm-slim bash -c '
            useradd -m -u 4242 tester
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq curl python3 ca-certificates >/dev/null 2>&1
            chown -R tester /home/tester
            su tester -c "bash /src/test/linux/install-script.sh"
          '

  # The Windows counterpart of linux-install/linux-installer. Two things
  # nothing else covers: that install.ps1 actually parses (a syntax error
  # in a script piped into `iex` is only ever discovered by a user), and
  # that a default install raises NO elevation prompt.
  #
  # The prompt check is the timeout. A GitHub runner is a non-elevated
  # account with no way to answer UAC, so a script that asked for it
  # would hang here rather than fail — which is precisely the signal we
  # want, and why this job's timeout is deliberately short.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "install.ps1 and every shipped .ps1 parses"
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'node_modules' }) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "PARSE ERRORS in $($f.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
              $bad = 1
            } else {
              Write-Host "OK $($f.Name)"
            }
          }
          if ($bad) { throw "PowerShell parse errors" }

      - name: "Elevation is requested only when Windows refuses"
        shell: pwsh
        run: |
          # Exercise the helpers directly rather than the whole install,
          # so this runs on pull requests too (where no release exists).
          # Dot-sourcing would run the installer, so pull the functions
          # out of the parsed AST instead.
          $src = Get-Content install.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($src, [ref]$null, [ref]$null)
          $fns = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          $names = $fns | ForEach-Object { $_.Name }
          foreach ($want in @('Invoke-Elevated', 'Test-AccessDenied', 'ps1Quote')) {
            if ($names -notcontains $want) { throw "install.ps1 lost $want" }
          }
          ($fns | Where-Object { $_.Name -in @('Test-AccessDenied','ps1Quote') } |
            ForEach-Object { $_.Extent.Text }) -join "`n" | Invoke-Expression

          # A permission error must elevate; nothing else may, or a user
          # gets a UAC prompt for a full disk.
          $denied = New-Object System.Management.Automation.ErrorRecord(
            (New-Object System.UnauthorizedAccessException "denied"), 'x',
            [System.Management.Automation.ErrorCategory]::PermissionDenied, $null)
          if (-not (Test-AccessDenied $denied)) { throw "UnauthorizedAccessException must count as access denied" }
          $other = New-Object System.Management.Automation.ErrorRecord(
            (New-Object System.IO.IOException "disk full"), 'x',
            [System.Management.Automation.ErrorCategory]::WriteError, $null)
          if (Test-AccessDenied $other) { throw "a disk-full error must NOT trigger an elevation prompt" }

          if ((ps1Quote "C:\Users\O'Brien\clawdh.exe") -ne "'C:\Users\O''Brien\clawdh.exe'") { throw "ps1Quote escaping wrong" }
          Write-Host "elevation trigger + quoting: OK"

      - name: "Default install completes with no elevation prompt"
        if: github.event_name == 'push'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # The real published install.ps1 flow. If it ever asks for
          # administrator rights on a default per-user install, there is
          # nobody here to answer and this step times out.
          ./install.ps1
          $dest = Join-Path $env:LOCALAPPDATA "clawdh\bin\clawdh.exe"
          if (-not (Test-Path $dest)) { throw "clawdh.exe not installed at $dest" }
          & $dest version
          & $dest uninstall
          Write-Host "per-user install with no elevation: OK"

  # The React UI is built into panel/webui and committed (so the Go embed and
  # every `go build` work without node). This rebuilds it and fails if the
  # committed bundle has drifted from web/ source — the UI can never ship stale.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI (fails on a broken build; warns if the commit drifted)
        run: |
          cd web && npm ci && npm run build
          cd ..
          if ! git diff --quiet -- panel/webui; then
            echo "::warning::panel/webui differs from a fresh build — run 'npm --prefix web run build' and commit."
            git diff --stat -- panel/webui
          fi

  build:
    needs: [test, e2e, browser, linux-install, web]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          name="clawdh_${{ matrix.goos }}_${{ matrix.goarch }}${ext}"
          mkdir -p dist
          # What this build covers, for the notification and the badges.
          # Subjects here are English sentences full of possessives, so ' turns
          # into a typographic ’ rather than being dropped ("nginx's" must not
          # ship as "nginxs"); ’ is a single rune with no meaning to the shell.
          # The octal set then strips " ` $ \ — what is left that would end the
          # ldflag's quoting or be expanded — so an ordinary subject survives
          # intact and a hostile one cannot inject anything. No length cut here:
          # cutting bytes splits UTF-8, and Headline already trims by rune.
          summary="$(git log -1 --pretty=%s | sed "s/'/’/g" | tr -d '\042\140\044\134')"
          go build -trimpath -ldflags "-s -w -X clawdh/internal/buildinfo.Version=${{ github.ref_name }} -X clawdh/internal/buildinfo.Commit=${{ github.sha }} -X 'clawdh/internal/buildinfo.Summary=${summary}'" \
            -o "dist/${name}" ./cmd/clawdh
          echo "ASSET_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/${{ env.ASSET_NAME }}

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only the build binaries — never the browser job's playwright-report
          # (a directory tree uploaded on a flaky failure), which would otherwise
          # land in dist and break the checksum and the release upload.
          pattern: clawdh_*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release title is what the update notification says ("Updated to
          # …"), so it carries the commit subject: a tag and a sha say which
          # build you got, not what it changed, which is the thing a person
          # actually wants from a notification that arrives unprompted.
          summary="$(git log -1 --pretty=%s | sed "s/'/’/g" | tr -d '\042\140\044\134')"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "${{ github.ref_name }}" dist/* \
              --title "${{ github.ref_name }} — ${summary}" \
              --generate-notes
          else
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest dist/* \
              --title "latest (main@$(git rev-parse --short HEAD)) — ${summary}" \
              --notes "Continuously published from main — install.sh/install.ps1 default to this. For a pinned version, use a vX.Y.Z release instead." \
              --latest
          fi

  # The server half of "both self-update on every release": the panel is a
  # Vercel deployment, and every push to main redeploys it, in lockstep with the
  # client release published above. Opt-in — it runs only once the three Vercel
  # secrets and the VERCEL_DEPLOY repo variable are set, so the pipeline is
  # unaffected until the panel is actually being hosted.
  deploy-panel:
    needs: publish
    if: ${{ github.event_name == 'push' && vars.VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the panel to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}"

  # Ship the gateway (the shared-subscription data plane) to the VPS on every
  # push to main — the server half that self-updates alongside the client
  # release and the Vercel panel. Opt-in behind GATEWAY_DEPLOY + the VPS secrets.
  deploy-gateway:
    needs: build
    if: ${{ github.event_name == 'push' && vars.GATEWAY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the gateway for linux/amd64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o clawdh-server ./cmd/clawdh-server
      - name: Ship it, migrating from ccam-gateway on first run
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 600 /dev/stdin key <<< "$KEY"
          SSHO="-i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # First run only: create the target dir and carry over a prior
          # ccam-gateway's env (it holds the panel key + DATABASE_URL).
          # clawdh-server reads the CLAWDH_* names and falls back to the CCAM_*
          # ones, so the old env keeps working unchanged.
          ssh $SSHO "root@$HOST" '
            set -e
            mkdir -p /opt/clawdh-server
            if [ ! -f /opt/clawdh-server/env ] && [ -f /opt/ccam-gateway/env ]; then
              install -m 600 /opt/ccam-gateway/env /opt/clawdh-server/env
            fi'

          # Upload the new binary and the systemd unit.
          scp $SSHO clawdh-server "root@$HOST:/opt/clawdh-server/clawdh-server.new"
          scp $SSHO deploy/clawdh-server.service "root@$HOST:/etc/systemd/system/clawdh-server.service"

          # Swap the binary in, (re)install the unit, and cut over from
          # ccam-gateway. Both serve 127.0.0.1:8787 and nginx already proxies the
          # gateway hostname there, so nothing about the URL members hold changes.
          # If the new service will not come up, roll back to ccam-gateway rather
          # than leave the gateway down.
          ssh $SSHO "root@$HOST" '
            set -e
            mv /opt/clawdh-server/clawdh-server.new /opt/clawdh-server/clawdh-server
            chmod +x /opt/clawdh-server/clawdh-server
            systemctl daemon-reload
            systemctl enable clawdh-server
            systemctl stop ccam-gateway 2>/dev/null || true
            if systemctl restart clawdh-server && sleep 2 && systemctl is-active --quiet clawdh-server; then
              systemctl disable ccam-gateway 2>/dev/null || true
              echo "clawdh-server is active (was ccam-gateway)"
            else
              echo "clawdh-server did not come up; rolling back to ccam-gateway" >&2
              systemctl start ccam-gateway 2>/dev/null || true
              journalctl -u clawdh-server -n 30 --no-pager || true
              exit 1
            fi'
          rm -f key
